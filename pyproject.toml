[project]
name = "F4CP"
version = "0.1.0"
description = "Fluor4CellPower battery and power management system"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "UF4OVER", email = "heping@hepi.ng" }
]
dependencies = [
    "pyqt-fluent-widgets[full] >=1.11.0",
    "cx-freeze>=8.5.3",
]

[project.optional-dependencies]
dev = [
    "pillow>=10.0.0",
    "pytest>=7.0",
]


[tool.uv]
constraint-dependencies = ["pyqt5-qt5 <=5.15.2"]


[tool.cxfreeze]
executables = [
    { script = "start.py",base = "gui", target_name = "F4CP", icon = "Resources/Assets/F4CP_ICO_256.ico" }
]

[tool.cxfreeze.build_exe]

build_exe = "build/exe"

includes = [
    "PyQt5.QtCore",
    "PyQt5.QtGui",
    "PyQt5.QtWidgets",
    "qfluentwidgets",
    "qframelesswindow",
]

packages = [
    "app",
]

# 注意：Config/config.py 里使用 Path("config.ini")，且 frozen 时 BaseDir=exe 同级
# 所以这里把 config.ini 直接放到 exe 同级，避免运行时找不到
include_files = [
    "Resources",
]

# Qt/GUI 相关建议不要进 zip（减少插件/资源加载问题；也便于排查缺文件）
zip_include_packages = ["*"]

zip_exclude_packages = [
    "PyQt5",
    "qfluentwidgets",
    "qframelesswindow",
]

excludes = [
    "numpy",
    "numpy.core",
    "numpy.linalg",
    "numpy.lib",
    "scipy",
    "scipy.linalg",
    "scipy.sparse",
    "scipy.special",
    "scipy._lib",
    "scipy.libs",
    "PIL",
    "scipy",
    "matplotlib",
    "backports",
    "lib2to3",
    "setuptools",
    "tkinter",
    "unittest",
    "pydoc",
]

optimize = 2

# Windows 运行时更稳（避免目标机器缺 VC++ runtime）
include_msvcr = true
