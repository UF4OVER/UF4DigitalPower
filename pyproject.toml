[project]
name = "F4CP"
version = "0.3.3"
description = "Fluor4CellPower battery and power management system"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "UF4OVER", email = "heping@hepi.ng" }
]

dependencies = [
    "cx-freeze>=8.5.3",
    "PyQt5>=5.15.2",
    "pyqtgraph >=0.14.0",
    "pyocd>=0.44.0",
    "numpy>=2.2.6",
    "pyqt-fluent-widgets>=1.11.2",
]

[tool.uv]
constraint-dependencies = ["pyqt5-qt5 <=5.15.2"]


[tool.cxfreeze]
executables = [
    { script = "start.py",base = "gui", target_name = "F4CP", icon = "Resources/Assets/F4CP_ICO_256.ico" }
]

[tool.cxfreeze.build_exe]

build_exe = "Build/exe"

includes = [
    "PyQt5.QtCore",
    "PyQt5.QtGui",
    "PyQt5.QtWidgets",
    "pyocd",
    "qfluentwidgets",
    "Config",
]

packages = [
    "App",
    "Config",
]

include_files = [
    "Resources",
]

# Qt/GUI 相关建议不要进 zip（减少插件/资源加载问题；也便于排查缺文件）
zip_include_packages = ["*"]

zip_exclude_packages = [
   "PyQt5",
   "lark",
   "numpy",
   "pyocd",
   "cmsis_pack_manager",
   "qfluentwidgets",
]

excludes = [
#    "numpy",
#    "numpy.core",
#    "numpy.linalg",
#    "numpy.lib",
    "scipy",
    "scipy.linalg",
    "scipy.sparse",
    "scipy.special",
    "scipy._lib",
    "scipy.libs",
    "PIL",
    "scipy",
    "matplotlib",
    "backports",
    "lib2to3",
    "setuptools",
    "tkinter",
    "unittest",
    "pylink",
    "pyocd.probe.jlink_probe",
]

optimize = 2

# Windows 运行时更稳（避免目标机器缺 VC++ runtime）
include_msvcr = true
