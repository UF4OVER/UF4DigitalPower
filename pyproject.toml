[project]
name = "F4CP"
version = "0.6.0.dev1"
# dev1    开发快照，最早期，不稳定
# a1       alpha 内测版，功能可能还没完整
# b1       beta 测试版，功能基本有了，但可能有 bug
# rc1      release candidate，候选正式版，接近正式发布
# 无后缀   正式版
description = "power management system"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "UF4OVER", email = "heping@hepi.ng" }
]

dependencies = [
    "cx-freeze>=8.6.4",
    "pyocd>=0.44.1",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.1",
    "pyside6-fluent-widgets>=1.11.2",
]

[tool.uv]
constraint-dependencies = ["pyside6 <= 6.11.1"]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]


[tool.cxfreeze]
executables = [
    { script = "start.py", base = "gui", target_name = "F4CP", icon = "Resources/Assets/F4CP_ICO_256.ico" },
    { script = "script/pyocd_launcher.py", base = "console", target_name = "pyocd" },
]

[tool.cxfreeze.build_exe]

build_exe = "build/exe"

includes = [
    "PySide6.QtCore",
    "PySide6.QtGui",
    "PySide6.QtWidgets",
    "PySide6.QtSerialPort",
    "PySide6.QtBluetooth",
    "PySide6.QtOpenGL",
    "PySide6.QtOpenGLWidgets",
    "PySide6.QtSvg",
    "PySide6.QtSvgWidgets",
    "pyocd",
    "qfluentwidgets",
    "numpy",
    "pyqtgraph",
    "config",
]

packages = [
    "app",

    "app.core",
    "app.controllers",
    "app.devices",
    "app.manager",
    "app.protocol",
    "app.session",
    "app.widgets",
    "app.window",

    "app.widgets.chart",
    "app.widgets.icon",
    "app.widgets.pages",

    "config"
]
include_files = [
    ["Resources/assets", "Resources/assets"],
    ["Resources/font", "Resources/font"],
    ["Resources/theme", "Resources/theme"],
    ["Resources/tools", "Resources/tools"],
    ["Resources/Config", "Resources/Config"],
]

# Qt/GUI 相关建议不要进 zip（减少插件/资源加载问题；也便于排查缺文件）
zip_include_packages = ["*"]

zip_exclude_packages = [
   "PySide6",
   "lark",
   "pyocd",
   "cmsis_pack_manager",
   "qfluentwidgets",
]

excludes = [

    "matplotlib",
    "backports",
    "lib2to3",
    "setuptools",
    "tkinter",
    "unittest",
    "pylink",
    "pyocd.probe.jlink_probe",
    # --- capstone disassembly (~7 MB, not needed) ---
    "capstone",
    "capstone.lib",
    # --- QtQuick / QML (not used) ---
    "PySide6.QtQuick",
    "PySide6.QtQml",
    "PySide6.QtQuickWidgets",
    # --- Other unused Qt modules ---
    "PySide6.QtPrintSupport",
    "PySide6.QtSql",
    "PySide6.QtTest",
    "PySide6.QtHelp",
    "PySide6.QtMultimedia",
    "PySide6.QtMultimediaWidgets",
    "PySide6.QtPositioning",
    "PySide6.QtSensors",
    "PySide6.QtTextToSpeech",
]

optimize = 2

# Windows 运行时更稳（避免目标机器缺 VC++ runtime）
include_msvcr = true
