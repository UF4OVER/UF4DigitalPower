[project]
name = "F4CP"
version = "0.5.3.rc2"
# dev1    开发快照，最早期，不稳定
# a1       alpha 内测版，功能可能还没完整
# b1       beta 测试版，功能基本有了，但可能有 bug
# rc1      release candidate，候选正式版，接近正式发布
# 无后缀   正式版
description = "power management system"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "UF4OVER", email = "heping@hepi.ng" }
]

dependencies = [
    "cx-freeze>=8.5.3",
    "PyQt5>=5.15.2",
    "pyocd>=0.44.0",
    "pyqt-fluent-widgets>=1.11.2",
    "pyqtgraph>=0.14.0",
]

[tool.uv]
constraint-dependencies = ["pyqt5-qt5 <=5.15.2"]


[tool.cxfreeze]
executables = [
    { script = "start.py", base = "gui", target_name = "F4CP", icon = "Resources/Assets/F4CP_ICO_256.ico" },
    { script = "script/pyocd_launcher.py", base = "console", target_name = "pyocd" },
]

[tool.cxfreeze.build_exe]

build_exe = "build/exe"

includes = [
    "PyQt5.QtCore",
    "PyQt5.QtGui",
    "PyQt5.QtWidgets",
    "pyocd",
    "qfluentwidgets",
    "numpy",
    "pyqtgraph",
    "config",
]

packages = [
    "app",

    "app.core",
    "app.devices",
    "app.manager",
    "app.protocol",
    "app.session",
    "app.widgets",

    "app.widgets.chart",
    "app.widgets.icon",
    "app.widgets.pages",

    "config"
]
include_files = [
    ["Resources/assets", "Resources/assets"],
    ["Resources/font", "Resources/font"],
    ["Resources/theme", "Resources/theme"],
    ["Resources/tools", "Resources/tools"],
    ["Resources/Config", "Resources/Config"],
]

# Qt/GUI 相关建议不要进 zip（减少插件/资源加载问题；也便于排查缺文件）
zip_include_packages = ["*"]

zip_exclude_packages = [
   "PyQt5",
   "lark",
   "pyocd",
   "cmsis_pack_manager",
   "qfluentwidgets",
]

excludes = [

    "matplotlib",
    "backports",
    "lib2to3",
    "setuptools",
    "tkinter",
    "unittest",
    "pylink",
    "pyocd.probe.jlink_probe",
    # --- capstone disassembly (~7 MB, not needed) ---
    "capstone",
    "capstone.lib",
    # --- QtQuick / QML (not used) ---
    "PyQt5.QtQuick",
    "PyQt5.QtQml",
    "PyQt5.QtQuickWidgets",
    # --- Other unused Qt modules ---
    "PyQt5.QtPrintSupport",
    "PyQt5.QtSql",
    "PyQt5.QtTest",
    "PyQt5.QtHelp",
    "PyQt5.QtMultimedia",
    "PyQt5.QtMultimediaWidgets",
    "PyQt5.QtPositioning",
    "PyQt5.QtSensors",
    "PyQt5.QtTextToSpeech",
    "PyQt5.QtWinExtras",
]

optimize = 2

# Windows 运行时更稳（避免目标机器缺 VC++ runtime）
include_msvcr = true
