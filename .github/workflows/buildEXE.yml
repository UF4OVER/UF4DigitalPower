name: Build F4CP (Windows)

on:
  push:
    branches: [F4CP_release]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: x64

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Build packaged exe
        run: |
          powershell -ExecutionPolicy Bypass -File .\Script\package_exe.ps1

      - name: Download UPX
        run: |
          curl -L -o upx.zip https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip
          tar -xf upx.zip
          echo "${{ github.workspace }}\\upx-4.2.4-win64" >> $env:GITHUB_PATH

      - name: Compress binaries with UPX
        run: |
          python Script/upx_zip.py

      - name: Package build output as zip
        run: |
          powershell Compress-Archive -Path build\exe\* -DestinationPath F4CP-Windows-x64.zip

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: F4CP-Windows-x64
          path: F4CP-Windows-x64.zip
